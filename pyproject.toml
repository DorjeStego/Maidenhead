[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maidenhead"
version = "0.1.0.dev3"
description = "A Python library for working with Maidenhead grid squares, geographic locators used mainly in Amateur Radio."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Ben Owen (2E0XPQ)" }]
classifiers = [
  "Programming Language :: Python :: 3",
]
urls = { "Repository" = "https://github.com/DorjeStego/Maidenhead" }

[project.scripts]
mh = "maidenhead.cli:development"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
maidenhead = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
